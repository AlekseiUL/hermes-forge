[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-forge"
version = "0.1.2"
description = "Anthropic-inspired local-first improvement control plane for Hermes Agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Aleksei Ulianov / Sprut_AI"}]
keywords = ["hermes-agent", "ai-agents", "evals", "local-first", "agent-improvement", "self-improvement", "control-plane"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
hermes-forge = "hermes_forge.cli:main"

[project.urls]
Homepage = "https://github.com/AlekseiUL/hermes-forge"
Repository = "https://github.com/AlekseiUL/hermes-forge"
Issues = "https://github.com/AlekseiUL/hermes-forge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_forge = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
